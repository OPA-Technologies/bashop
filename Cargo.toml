[package]
name = "bashop"
version = "1.0.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-or-later"
description = "Cadre terminal permanent (3 lignes) et prompt thémé multi-shell, multi-OS."
keywords = ["prompt", "tui", "pty", "shell", "terminal"]
categories = ["command-line-interface"]

[lib]
name = "bashop"
path = "src/lib.rs"

[[bin]]
name = "bashop"
path = "src/main.rs"

[dependencies]
op-tui = { path = "op-tui" }
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
portable-pty = "0.9.0"
vte = "0.15.0"
unicode-width = "0.2.2"
libc = "0.2.190"
crossterm = "0.29"
time = { version = "0.3.55", features = ["local-offset", "formatting", "macros"] }
ratatui = "0.30"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
